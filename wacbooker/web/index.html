<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAC Court Booker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c8dc3c'/%3E%3Cpath d='M5 9c6 3 6 11 0 14M27 9c-6 3-6 11 0 14' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f3f6f2; --surface: #ffffff; --surface-2: #f8faf7; --ink: #17241c; --muted: #56655b;
  --line: #d9e1da; --accent: #2a7a4b; --accent-ink: #ffffff; --accent-soft: #e2f1e7; --accent-line: #a9d3b8;
  --warn: #8a4b00; --warn-soft: #fff4e0; --warn-line: #f0cf95;
  --bad: #a52a22; --bad-soft: #fdecea; --bad-line: #f0b5af;
  --ball: #c8dc3c; --focus: #1f6feb; --shadow: 0 1px 2px rgba(20,40,25,.06), 0 4px 16px rgba(20,40,25,.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111814; --surface: #19221c; --surface-2: #1e2922; --ink: #e8efe9; --muted: #a3b2a8;
    --line: #2e3b32; --accent: #5cc184; --accent-ink: #0c1a11; --accent-soft: #1f3527; --accent-line: #2f5a3e;
    --warn: #f3c27a; --warn-soft: #33281a; --warn-line: #5c4626;
    --bad: #ff9c94; --bad-soft: #3a1f1d; --bad-line: #6b322d;
    --focus: #6ea8ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.5;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.12rem; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
[hidden] { display: none !important; }

/* header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top-in { max-width: 980px; margin: 0 auto; padding: 12px 20px 0; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.35rem; }
.brand .ver { color: var(--muted); font-size: .9rem; }
.brand .spacer { flex: 1; }
.linkish { background: none; border: 0; padding: 4px 2px; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
nav.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: none; padding: 10px 16px 12px; cursor: pointer; font-weight: 600; color: var(--muted);
  border-bottom: 3px solid transparent; white-space: nowrap;
}
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }

/* banners */
.banner { border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; border: 1px solid; }
.banner.info { background: var(--accent-soft); border-color: var(--accent-line); }
.banner.warn { background: var(--warn-soft); border-color: var(--warn-line); }
.banner.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.banner h3 { margin-bottom: 4px; }
.banner ol, .banner ul { margin: 6px 0 0; padding-left: 22px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 10px 18px;
  font-weight: 600; cursor: pointer; min-height: 44px; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--accent-line); background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { font-size: 1.1rem; padding: 14px 26px; min-height: 56px; border-radius: 12px; }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
.card.paused { opacity: .8; }
.card-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.pill { display: inline-block; border-radius: 99px; padding: 3px 12px; font-size: .85rem; font-weight: 700; }
.pill.on { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); }
.pill.off { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
.facts { margin: 8px 0 0; }
.facts div { margin: 2px 0; }
.next { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
.next h4 { margin: 0 0 6px; font-size: .95rem; color: var(--muted); font-weight: 600; }
.next ul { list-style: none; margin: 0; padding: 0; }
.next li { padding: 6px 0; border-top: 1px dashed var(--line); }
.next li:first-child { border-top: 0; }
.next .when { font-weight: 700; }
.task { margin-top: 10px; font-size: .92rem; }
.task.bad { color: var(--bad); font-weight: 600; }
.card .actions { margin-top: 16px; }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.empty { text-align: center; padding: 48px 20px; }
.empty .ball { width: 72px; height: 72px; margin: 0 auto 12px; }

/* form */
.form-section { padding: 18px 0; border-top: 1px solid var(--line); }
.form-section:first-of-type { border-top: 0; padding-top: 4px; }
.form-section > h3 { margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.form-section > h3 .n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .9rem; flex: none; }
.hint { color: var(--muted); font-size: .92rem; margin: -4px 0 10px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.choice {
  border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 18px;
  cursor: pointer; font-weight: 600; min-height: 52px; min-width: 64px; position: relative;
}
.choice:hover { border-color: var(--accent-line); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.choice small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
.choice .order {
  position: absolute; top: -10px; right: -10px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); font-size: .85rem; display: grid; place-items: center;
}
.choice.court { min-width: 72px; font-size: 1.15rem; }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; padding: 6px 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
input[type=text], input[type=password], input[type=date], input[type=search], select {
  border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); min-height: 48px; width: 100%; max-width: 420px;
}
input:focus, select:focus { border-color: var(--accent); outline: none; }
label.field { display: block; margin-bottom: 12px; }
label.field span { display: block; font-weight: 600; margin-bottom: 4px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 10px; max-height: 320px; overflow: auto; padding: 4px; }
.person { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.person:hover { border-color: var(--accent-line); }
.person[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.person .tag { font-size: .78rem; font-weight: 700; color: var(--accent); margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.chip { display: inline-flex; gap: 8px; align-items: center; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 99px; padding: 6px 8px 6px 14px; font-weight: 600; }
.chip button { border: 0; background: none; cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 2px 6px; border-radius: 50%; }
.summary { position: sticky; bottom: 0; background: var(--surface); border: 2px solid var(--accent-line); border-radius: var(--radius); padding: 16px 18px; margin-top: 18px; box-shadow: var(--shadow); }
.summary p { margin: 0 0 12px; font-size: 1.05rem; }
.errors { color: var(--bad); margin: 0 0 10px; padding-left: 20px; }

/* results */
.result { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.result:first-child { border-top: 0; }
.ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
.ico.good { background: var(--accent-soft); color: var(--accent); }
.ico.bad { background: var(--bad-soft); color: var(--bad); }
.ico.meh { background: var(--warn-soft); color: var(--warn); }
.ico.plain { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* settings */
.set-row { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.set-row:first-of-type { border-top: 0; }
.set-row .txt { flex: 1 1 320px; }
.status-ok { color: var(--accent); font-weight: 700; }
.status-no { color: var(--warn); font-weight: 700; }

/* welcome */
.steps { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.steps span { padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
.steps span.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.steps span.done { color: var(--accent); border-color: var(--accent-line); }

/* dialog */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(10,20,14,.45); }
.dlg { padding: 22px 24px; }
.dlg h2 { font-size: 1.3rem; margin-bottom: 10px; }
.log { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; max-height: 300px; overflow: auto; margin: 12px 0; }
.log p { margin: 4px 0; }
.spin { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--accent-line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -3px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.question { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 10px; padding: 12px 14px; }
.question p { margin: 0 0 10px; font-weight: 600; }
.skiplist { display: grid; gap: 8px; margin: 12px 0; }

/* toast */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 12px; box-shadow: var(--shadow); max-width: min(640px, calc(100vw - 32px)); z-index: 20; }
#toast.bad { background: var(--bad); color: #fff; }

#gone { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 30; padding: 24px; text-align: center; }

@media (max-width: 600px) {
  html { font-size: 16px; }
  main { padding: 16px 16px 80px; }
  .top-in { padding: 10px 16px 0; }
  .card { padding: 16px; }
  nav.tabs button { padding: 10px 10px 12px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--ball)"/><path d="M5 9c6 3 6 11 0 14M27 9c-6 3-6 11 0 14" stroke="#fff" stroke-width="2" fill="none"/></svg>
      <h1>WAC Court Booker</h1>
      <span class="ver" id="ver"></span>
      <span class="spacer"></span>
      <button class="linkish" id="check-update" type="button">Check for updates</button>
    </div>
    <nav class="tabs" aria-label="Pages">
      <button type="button" data-view="home">My bookings</button>
      <button type="button" data-view="results">What happened</button>
      <button type="button" data-view="settings">Settings</button>
    </nav>
  </div>
</header>
<main>
  <div id="update-banner" hidden></div>
  <div id="view"></div>
</main>
<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="gone" hidden><div><h2>WAC Court Booker has closed</h2><p class="muted">Open it again from the Start menu or your desktop. Your bookings still run on schedule.</p></div></div>

<script>
"use strict";
// ------------------------------------------------------------------ plumbing
const TOKEN = (() => {
  const m = location.hash.match(/t=([\w-]+)/);
  try {
    if (m) { sessionStorage.setItem("wacb-t", m[1]); history.replaceState(null, "", location.pathname); return m[1]; }
    return sessionStorage.getItem("wacb-t") || "";
  } catch (e) { return m ? m[1] : ""; }
})();
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
let S = null;          // last /api/state
let view = "home";
let form = null;       // the booking being edited
let welcomeStep = null;

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, body) {
  let r;
  try {
    r = await fetch(path, body === undefined ? { headers: { "X-WACB-Token": TOKEN } } : {
      method: "POST", headers: { "X-WACB-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
  } catch (e) { $("#gone").hidden = false; throw e; }
  if (r.status === 403) { $("#gone").hidden = false; throw new Error("not allowed"); }
  return r.json();
}

function fmtTime(m) {
  const h = Math.floor(m / 60), mi = m % 60;
  return `${(h % 12) || 12}:${String(mi).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
}
function spanText(start, len) {
  const a = fmtTime(start), z = fmtTime((start + len) % 1440);
  return a.slice(-2) === z.slice(-2) ? `${a.slice(0, -3)} to ${z}` : `${a} to ${z}`;
}
function namesText(n) { return n.length <= 1 ? (n[0] || "") : n.slice(0, -1).join(", ") + " and " + n[n.length - 1]; }
function firstName(n) { return n.split(" ")[0]; }

let toastTimer = null;
function toast(msg, bad = false) {
  const t = $("#toast");
  t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), bad ? 9000 : 4500);
}

// Show what a save did; ask for the Windows password if signed-out runs need it again.
async function afterSave(r, okText) {
  if (!r.ok) { toast((r.errors || ["That wasn't saved."]).join(" "), true); return false; }
  const notes = [okText || "Saved."];
  if (r.task_problem) notes.push(r.task_problem);
  (r.task_errors || []).forEach((e) => notes.push("Task problem: " + e));
  if (r.task_note && !r.need_windows_password) notes.push(r.task_note);
  (r.warnings || []).forEach((w) => notes.push(w));
  toast(notes.join(" "), !!(r.task_problem || (r.task_errors || []).length));
  if (r.need_windows_password) await askWindowsPassword();
  return true;
}

// ------------------------------------------------------------------ dialogs
const dlg = $("#dlg");
function openDialog(html) { $("#dlg-body").innerHTML = html; if (!dlg.open) dlg.showModal(); }
function closeDialog() { if (dlg.open) dlg.close(); }
dlg.addEventListener("cancel", (e) => { if (dlg.dataset.locked) e.preventDefault(); });

function confirmBox(title, text, yes = "Yes", danger = false) {
  return new Promise((resolve) => {
    openDialog(`<h2>${esc(title)}</h2><p>${esc(text)}</p>
      <div class="row end"><button class="btn" id="c-no" type="button">Cancel</button>
      <button class="btn ${danger ? "danger solid" : "primary"}" id="c-yes" type="button">${esc(yes)}</button></div>`);
    $("#c-no").onclick = () => { closeDialog(); resolve(false); };
    $("#c-yes").onclick = () => { closeDialog(); resolve(true); };
    dlg.addEventListener("close", () => resolve(false), { once: true });
    $("#c-yes").focus();
  });
}

function askWindowsPassword() {
  return new Promise((resolve) => {
    openDialog(`<h2>Windows password</h2>
      <p>You chose to let bookings run while you're signed out of Windows. For that, Windows stores your <b>Windows</b> password with each scheduled task. (Windows keeps it, not this app.)</p>
      <label class="field"><span>Your Windows password</span><input type="password" id="wp" autocomplete="current-password"></label>
      <p class="muted small">Not now: bookings still run, but only while you're signed in (the screen can be locked).</p>
      <div class="row end"><button class="btn" id="wp-no" type="button">Not now</button><button class="btn primary" id="wp-ok" type="button">Save</button></div>`);
    const done = (v) => { closeDialog(); resolve(v); };
    $("#wp").focus();
    $("#wp-no").onclick = () => done(false);
    const go = async () => {
      const pw = $("#wp").value; $("#wp").value = "";
      if (!pw) return;
      $("#wp-ok").disabled = true;
      const r = await api("/api/windows-password", { password: pw });
      if (r.signed_out) toast("Saved. Bookings run even when you're signed out.");
      else toast(r.task_note || r.task_problem || (r.errors || []).join(" ") || "Windows didn't accept that.", true);
      done(!!r.signed_out); refresh();
    };
    $("#wp-ok").onclick = go;
    $("#wp").onkeydown = (e) => { if (e.key === "Enter") go(); };
  });
}

// A club-site job: progress lines, Yes/No questions, then Close.
function runJob(body, then) {
  return new Promise(async (resolve) => {
    const r = await api("/api/job", body);
    if (!r.ok) { toast((r.errors || []).join(" "), true); resolve(null); return; }
    followJob(r.job, (j) => { if (then) then(j); resolve(j); });
  });
}
function followJob(job, onDone) {
  dlg.dataset.locked = "1";
  let answered = null;
  const draw = (j) => {
    const lines = j.lines.map((l) => `<p>${esc(l)}</p>`).join("") || `<p class="muted">Starting…</p>`;
    const q = j.question && answered !== j.question.text ? `<div class="question"><p>${esc(j.question.text)}</p>
        <div class="row"><button class="btn primary" id="q-yes" type="button">Yes</button><button class="btn" id="q-no" type="button">No</button></div></div>` : "";
    const status = j.done ? (j.ok ? `<p class="status-ok">Done.</p>` : `<p class="status-no">Finished with a problem (see above).</p>`)
      : (q ? "" : `<p><span class="spin"></span>Working on it. This takes about a minute; you can wait here.</p>`);
    openDialog(`<h2>${esc(j.title)}</h2><div class="log" id="joblog">${lines}</div>${q}${status}
      ${j.done ? `<div class="row end"><button class="btn primary" id="j-close" type="button">Close</button></div>` : ""}`);
    const log = $("#joblog"); log.scrollTop = log.scrollHeight;
    if (q) {
      const send = async (yes) => { answered = j.question.text; await api("/api/job/answer", { id: j.id, yes }); };
      $("#q-yes").onclick = () => send(true); $("#q-no").onclick = () => send(false);
    }
    if (j.done) {
      delete dlg.dataset.locked;
      $("#j-close").focus();
      $("#j-close").onclick = () => { closeDialog(); onDone(j); refresh(); };
    }
  };
  draw(job);
  let last = "";
  const tick = async () => {
    let r;
    try { r = await api("/api/job?id=" + encodeURIComponent(job.id)); } catch (e) { return; }
    if (!r.ok) { delete dlg.dataset.locked; closeDialog(); onDone(job); return; }
    const sig = JSON.stringify(r.job);
    if (sig !== last) { last = sig; if (!r.job.question) answered = null; draw(r.job); }
    if (!r.job.done) setTimeout(tick, 800);
  };
  setTimeout(tick, 600);
}

// ------------------------------------------------------------------ navigation
function go(v) {
  view = v;
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false"));
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach((b) => (b.onclick = () => { form = null; go(b.dataset.view); }));

async function refresh() {
  S = await api("/api/state");
  $("#ver").textContent = "version " + S.version;
  if (S.job && !S.job.done && !dlg.open) followJob(S.job, () => {});
  if (!S.logins.length && welcomeStep === null) welcomeStep = 0;
  render();
}

function render() {
  const el = $("#view");
  if (!S) return;
  document.querySelector("nav.tabs").hidden = welcomeStep !== null;
  if (welcomeStep !== null) return renderWelcome(el);
  if (form) return renderForm(el);
  if (view === "results") return renderResults(el);
  if (view === "settings") return renderSettings(el);
  return renderHome(el);
}

// ------------------------------------------------------------------ updates
async function checkUpdate(force) {
  const u = await api("/api/update" + (force ? "?force=1" : ""));
  const b = $("#update-banner");
  if (u.newer) {
    b.className = "banner info"; b.hidden = false;
    b.innerHTML = `<h3>A newer version is ready: ${esc(u.latest)}</h3>
      <p style="margin:4px 0 0">You have ${esc(u.current)}. To update:</p>
      <ol><li><a href="${esc(u.download || u.url)}" target="_blank" rel="noopener">Download the new version</a> (a .zip file).</li>
      <li>Open your Downloads folder, right-click the file and choose <b>Extract All</b>.</li>
      <li>Close this window, then double-click <b>setup.cmd</b> in the new folder. Your bookings and logins are kept.</li></ol>
      <p class="small muted" style="margin:6px 0 0"><a href="${esc(u.url)}" target="_blank" rel="noopener">What's new in ${esc(u.latest)}</a></p>`;
  } else {
    b.hidden = true;
    if (force) toast(u.checked ? `You have the newest version (${u.current}).` : (u.error + " Try again later, or look at the releases page."), !u.checked);
  }
}
$("#check-update").onclick = () => checkUpdate(true);

        <button class="linkish small" data-act="dry" data-i="${i}" type="button">Look at the court sheet now</button>

}

async function bookingAction(act, b) {
  if (act === "edit") return startForm(b);
  if (act === "pause") {
    const r = await api("/api/booking/pause", { name: b.name, active: !b.active });
    await afterSave(r, b.active ? "Paused. Nothing books until you turn it back on." : "Turned back on.");
    return refresh();
  }
  if (act === "remove") {
    if (!(await confirmBox("Remove this booking?", `${b.title}, ${b.who.toLowerCase()}. The app stops booking it. Courts already booked on the club site stay booked.`, "Remove", true))) return;
    const r = await api("/api/booking/remove", { name: b.name });
    await afterSave(r, "Removed.");
    return refresh();
  }
  if (act === "dry") {
    return runJob({ kind: "dry-run", booking: b.name });
  }
  if (act === "skip") {
    openDialog(`<h2>Skip a week</h2><p>Tick a date to skip it. Nothing is booked that week. Untick it to book it again.</p>
      <div class="skiplist">${b.upcoming.map((u, k) => `<label class="check"><input type="checkbox" data-k="${k}" ${u.skipped ? "checked" : ""}> ${esc(u.label)}</label>`).join("")}</div>
      <div class="row end"><button class="btn primary" id="sk-done" type="button">Done</button></div>`);
    $("#sk-done").onclick = closeDialog;
    $("#dlg-body").querySelectorAll("input[data-k]").forEach((cb) => (cb.onchange = async () => {
      const u = b.upcoming[+cb.dataset.k];
      cb.disabled = true;
      const r = await api("/api/booking/skip", { name: b.name, date: u.date, skip: cb.checked });
      cb.disabled = false;
      if (r.ok) { u.skipped = cb.checked; toast(cb.checked ? `Skipping ${u.label}.` : `${u.label} will be booked.`); refresh(); }
      else { cb.checked = !cb.checked; toast((r.errors || []).join(" "), true); }
    }));
  }
}

// ------------------------------------------------------------------ booking form
function startForm(b) {
  const login = b ? b.login : (S.logins[0] || {}).nickname;
  form = b ? { old_name: b.name, login, play: b.play, partners: [...b.partners], weekly: b.weekly, day: b.day, date: b.date,
    time: b.time, length: b.length, shorter_ok: b.shorter_ok, courts: b.courts.filter((c) => c !== "any"), any: b.courts.includes("any"), errors: [], q: "" }
    : { login, play: "singles", partners: [], weekly: true, day: null, date: null, time: null, length: 90, shorter_ok: true, courts: [], any: true, errors: [], q: "" };
  window.scrollTo(0, 0);
  render();
}

function loginOf(nick) { return S.logins.find((l) => l.nickname === nick) || { family: [], buddies: [] }; }

function summaryText(f) {
  const need = f.play === "doubles" ? 3 : 1;
  const missing = [];
  if (f.partners.length !== need) missing.push(need === 1 ? "who you're playing with" : `${need - f.partners.length} more player${need - f.partners.length > 1 ? "s" : ""}`);
  if (f.weekly ? f.day === null : !f.date) missing.push(f.weekly ? "the day" : "the date");
  if (f.time === null) missing.push("the time");
  if (!f.courts.length && !f.any) missing.push("a court");
  if (missing.length) return { ok: false, text: "Still to choose: " + namesText(missing) + "." };
  let when;
  if (f.weekly) when = `Every ${DAYS[f.day]}`;
  else { const d = new Date(f.date + "T12:00:00"); when = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }); }
  const courts = f.courts.length ? `Court ${f.courts.join(", then ")}${f.any ? ", then any other court" : ""}` : "Any court";
  const shorter = f.shorter_ok && f.length > 30 ? `, or shorter if no court has ${f.length} minutes` : "";
  return { ok: true, text: `${when}, ${spanText(f.time, f.length)} (${f.length} minutes${shorter}). ${f.play === "singles" ? "Singles" : "Doubles"} with ${namesText(f.partners)}. ${courts}.` };
}

function renderForm(el) {
  const f = form;
  const lg = loginOf(f.login);
  const need = f.play === "doubles" ? 3 : 1;
  let n = 0;
  const sec = (title, body, hint = "") => `<section class="form-section"><h3><span class="n">${++n}</span>${title}</h3>${hint ? `<p class="hint">${hint}</p>` : ""}${body}</section>`;
  const choice = (key, val, label, sub = "") => `<button type="button" class="choice" data-k="${key}" data-v="${esc(JSON.stringify(val))}" aria-pressed="${JSON.stringify(f[key]) === JSON.stringify(val)}">${label}${sub ? `<small>${sub}</small>` : ""}</button>`;

  let h = `<div class="page-head"><h2>${f.old_name ? "Change booking" : "Book a court"}</h2><button class="btn" id="f-cancel" type="button">Cancel</button></div><div class="card">`;
  if (S.logins.length > 1) h += sec("Whose club login books it?", `<div class="choices">${S.logins.map((l) => choice("login", l.nickname, esc(l.nickname), esc(l.username))).join("")}</div>`);
  h += sec("Singles or doubles?", `<div class="choices">${choice("play", "singles", "Singles", "You and 1 other")}${choice("play", "doubles", "Doubles", "You and 3 others")}</div>`);

  // people
  const fam = lg.family || [], bud = lg.buddies || [];
  const all = [...fam.map((x) => ({ n: x, fam: true })), ...bud.map((x) => ({ n: x, fam: false }))];
  const q = f.q.trim().toLowerCase();
  const shown = all.filter((p) => !q || q.split(/\s+/).every((w) => p.n.toLowerCase().includes(w)));
  const chips = f.partners.map((p, i) => `<span class="chip">${esc(p)}<button type="button" data-rm="${i}" aria-label="Take ${esc(p)} off">×</button></span>`).join("");
  let people = `<div class="chips">${chips || `<span class="muted">Nobody chosen yet.</span>`}</div>`;
  if (all.length) {
    people += `<input type="search" id="f-q" placeholder="Type a name to narrow the list" value="${esc(f.q)}" aria-label="Search names">
      <div class="people">${shown.map((p) => `<button type="button" class="person" data-p="${esc(p.n)}" aria-pressed="${f.partners.includes(p.n)}">${esc(p.n)}${p.fam ? `<span class="tag">FAMILY</span>` : ""}</button>`).join("") || `<p class="muted">Nobody matches. Use "Someone else" below.</p>`}</div>`;
  } else {
    people += `<p class="muted">The app hasn't read your buddy list yet. <button class="linkish" id="f-readb" type="button">Read it now</button> (about a minute), or type the name below.</p>`;
  }
  if (!lg.family_read && all.length) people += `<p class="small muted">Family members aren't listed yet. <button class="linkish" id="f-readf" type="button">Find my family members</button></p>`;
  people += `<details style="margin-top:10px" ${all.length ? "" : "open"}><summary>Someone else (not in the list)</summary>
     <div class="row" style="margin-top:8px"><input type="text" id="f-other" placeholder="Full name, as the club site shows it" style="max-width:320px"><button class="btn" id="f-addother" type="button">Add</button></div></details>`;
  h += sec(`Who are you playing with?`, people, `Choose ${need === 1 ? "1 person" : "3 people"}. Family members are at the top.`);

  h += sec("How often?", `<div class="choices">${choice("weekly", true, "Every week")}${choice("weekly", false, "Just once")}</div>`);
  if (f.weekly) h += sec("Which day?", `<div class="choices">${DAYS.map((d, i) => choice("day", i, d.slice(0, 3), "")).join("")}</div>`);
  else {
    const min = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    h += sec("Which date?", `<input type="date" id="f-date" min="${min}" value="${esc(f.date || "")}">`, "More than a week away. For sooner dates, book on the club site.");
  }
  const times = []; for (let m = 5 * 60; m <= 21 * 60 + 30; m += 30) times.push(m);
  h += sec("What time do you start?", `<select id="f-time" aria-label="Start time"><option value="">Choose a time</option>${times.map((m) => `<option value="${m}" ${f.time === m ? "selected" : ""}>${fmtTime(m)}</option>`).join("")}</select>`);
  h += sec("How long?", `<div class="choices">${[30, 60, 90].map((L) => choice("length", L, `${L} min`)).join("")}</div>
     ${f.length > 30 ? `<label class="check"><input type="checkbox" id="f-shorter" ${f.shorter_ok ? "checked" : ""}> If no court has ${f.length} minutes, take a shorter time at the same start</label>` : ""}`);
  h += sec("Which courts?", `<div class="choices">${S.courts.map((c) => { const k = f.courts.indexOf(c); return `<button type="button" class="choice court" data-court="${c}" aria-pressed="${k >= 0}">${c}${k >= 0 ? `<span class="order">${k + 1}</span>` : ""}</button>`; }).join("")}</div>
     <label class="check" style="margin-top:8px"><input type="checkbox" id="f-any" ${f.any ? "checked" : ""}> Any other court if ${f.courts.length ? "those are" : "none is chosen or they're"} taken</label>`,
    "Press courts in the order you like them: first choice first. Press again to take one off. Choosing none means any court.");
  h += `</div>`;
  const s = summaryText(f);
  h += `<div class="summary">${f.errors.length ? `<ul class="errors">${f.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
    <p>${s.ok ? "<b>You're booking:</b> " : ""}${esc(s.text)}</p>
    <div class="row"><button class="btn primary big" id="f-save" type="button" ${s.ok ? "" : "disabled"}>${f.old_name ? "Save changes" : "Save booking"}</button><button class="btn" id="f-cancel2" type="button">Cancel</button></div></div>`;
  el.innerHTML = h;

  const cancel = () => { form = null; render(); };
  $("#f-cancel").onclick = cancel; $("#f-cancel2").onclick = cancel;
  el.querySelectorAll(".choice[data-k]").forEach((b) => (b.onclick = () => {
    const k = b.dataset.k, v = JSON.parse(b.dataset.v);
    f[k] = v;
    if (k === "play") { const nn = v === "doubles" ? 3 : 1; f.partners = f.partners.slice(0, nn); }
    if (k === "login") f.partners = [];
    f.errors = []; render();
  }));
  el.querySelectorAll(".person").forEach((b) => (b.onclick = () => {
    const p = b.dataset.p, i = f.partners.indexOf(p);
    if (i >= 0) f.partners.splice(i, 1);
    else if (f.partners.length < need) f.partners.push(p);
    else if (need === 1) f.partners = [p];
    else { toast(`Doubles has 3 others. Take someone off first.`); return; }
    if (f.partners.length === need) f.q = "";
    f.errors = []; render();
  }));
  el.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => { f.partners.splice(+b.dataset.rm, 1); render(); }));
  const qi = $("#f-q");
  if (qi) qi.oninput = () => { f.q = qi.value; const pos = qi.selectionStart; render(); const n2 = $("#f-q"); n2.focus(); n2.setSelectionRange(pos, pos); };
  const addOther = () => {
    const v = $("#f-other").value.trim().replace(/\s+/g, " ");
    if (v.split(" ").length < 2) { toast("Type their first and last name.", true); return; }
    if (f.partners.length >= need) { if (need === 1) f.partners = []; else { toast("Doubles has 3 others. Take someone off first."); return; } }
    if (!f.partners.includes(v)) f.partners.push(v);
    render();
  };
  if ($("#f-addother")) { $("#f-addother").onclick = addOther; $("#f-other").onkeydown = (e) => { if (e.key === "Enter") addOther(); }; }
  if ($("#f-readb")) $("#f-readb").onclick = () => runJob({ kind: "buddies", login: f.login });
  if ($("#f-readf")) $("#f-readf").onclick = () => familyJob(f.login);
  if ($("#f-date")) $("#f-date").onchange = (e) => { f.date = e.target.value || null; render(); };
  $("#f-time").onchange = (e) => { f.time = e.target.value === "" ? null : +e.target.value; f.errors = []; render(); };
  if ($("#f-shorter")) $("#f-shorter").onchange = (e) => { f.shorter_ok = e.target.checked; render(); };
  $("#f-any").onchange = (e) => { f.any = e.target.checked; render(); };
  el.querySelectorAll("[data-court]").forEach((b) => (b.onclick = () => {
    const c = +b.dataset.court, i = f.courts.indexOf(c);
    if (i >= 0) f.courts.splice(i, 1); else f.courts.push(c);
    render();
  }));
  $("#f-save").onclick = saveForm;
}

async function saveForm() {
  const f = form;
  const body = { old_name: f.old_name, login: f.login, play: f.play, partners: f.partners, weekly: f.weekly, day: f.day, date: f.date,
    time: f.time, length: f.length, shorter_ok: f.shorter_ok, courts: [...f.courts, ...(f.any || !f.courts.length ? ["any"] : [])] };
  $("#f-save").disabled = true;
  const r = await api("/api/booking", body);
  if (!r.ok) { f.errors = r.errors || ["That wasn't saved."]; render(); return; }
  form = null; welcomeStep = null; view = "home";
  await afterSave(r, "Saved. The app will book it when the club opens it.");
  await refresh();
}

function familyJob(login) {
  return new Promise(async (resolve) => {
    const ok = await confirmBox("Find your family members",
      "The club site lists family members only after a court is in your cart. The app puts a quiet 30-minute court in your cart for a few seconds, reads the names, then presses Back, which empties the cart. Nothing is booked.",
      "Find them");
    if (!ok) return resolve(null);
    resolve(await runJob({ kind: "family", login }));
  });
}

async function renderResults(el) {
  el.innerHTML = `<div class="page-head"><h2>What happened</h2></div><div class="card"><p><span class="spin"></span>Loading…</p></div>`;
  const r = await api("/api/results");
  if (view !== "results" || form) return;
  const icon = (x) => x.status === "booked" ? ["good", "✓"] : x.status === "cancelled" ? ["plain", "↺"] : x.status === "skipped" ? ["plain", "↷"]
    : x.status === "unsure" ? ["meh", "?"] : ["bad", "✕"];
  const rows = r.results.map((x) => { const [c, s] = icon(x); return `<div class="result"><div class="ico ${c}" aria-hidden="true">${s}</div>
    <div><div><b>${esc(x.kind === "test" ? "Test booking" : x.booking)}</b> <span class="muted small">· ${esc(x.when)}</span></div><div>${esc(x.message)}</div></div></div>`; }).join("");
  el.innerHTML = `<div class="page-head"><div><h2>What happened</h2><p class="muted" style="margin:4px 0 0">Every booking run, newest first. You also get a notification on this PC each time.</p></div>
    <button class="btn" id="open-log" type="button">Open the full log</button></div>
    <div class="card">${rows || `<p class="muted">Nothing has run yet. Your first booking shows here after its booking time.</p>`}</div>`;
  $("#open-log").onclick = async () => { const x = await api("/api/open-log", {}); if (!x.ok) toast((x.errors || []).join(" "), true); };
}

  </div>`;

  const partnerOpts = (() => { const l = S.logins[0]; if (!l) return ""; return [...l.family, ...l.buddies].map((n) => `<option>${esc(n)}</option>`).join(""); })();
  h += `<div class="card"><h3>Make a test booking</h3><p class="muted">Books a real 30-minute singles court more than a day away, at a quiet time, so cancelling is free. Then it asks whether to cancel it. Use it once to see the whole thing work.</p>
    ${S.logins.length ? `<div class="row">${S.logins.length > 1 ? `<select id="tb-login" style="max-width:220px" aria-label="Login">${S.logins.map((l) => `<option value="${esc(l.nickname)}">${esc(l.username)}</option>`).join("")}</select>` : ""}
      <select id="tb-partner" style="max-width:280px" aria-label="Partner"><option value="">Who would you play with?</option>${partnerOpts}</select>
      <button class="btn" id="tb-go" type="button">Make a test booking</button></div>` : `<p class="muted">Add a login first.</p>`}</div>`;

  h += `<div class="card"><h3>Browser the app uses</h3>
    <div class="choices" style="margin-top:10px">${[["hidden", "Hidden (normal)", "The app's own browser, no window"], ["edge", "Microsoft Edge", "Separate profile"], ["chrome", "Google Chrome", "Separate profile"]]
      .map(([v, a, b]) => `<button type="button" class="choice" data-br="${v}" aria-pressed="${st.browser === v}">${a}<small>${b}</small></button>`).join("")}</div>
    ${st.browser !== "hidden" ? `<label class="check" style="margin-top:8px"><input type="checkbox" id="showwin" ${st.show_window ? "checked" : ""}> Show the browser window while it books (to watch it work)</label>` : ""}
    <p class="small muted">Your everyday browser profile, bookmarks and passwords are never touched.</p></div>`;

  h += `<div class="card"><h3>Desktop shortcut</h3>
    <div class="set-row"><div class="txt"><b>${st.desktop_shortcut ? "There's a WAC Court Booker shortcut on your desktop" : "No shortcut on your desktop yet"}</b><br><span class="small muted">It opens this window. Make it again if it's missing or opens the old text menu.</span></div>
      <button class="btn" id="desk" type="button">${st.desktop_shortcut ? "Make it again" : "Put one on my desktop"}</button></div></div>`;

  h += `<div class="card"><h3>About</h3><p>WAC Court Booker ${esc(S.version)}. <button class="linkish" id="upd2" type="button">Check for updates</button></p>
    <p class="small muted">Settings file: ${esc(S.config_file)}</p><button class="btn" id="log2" type="button">Open the log</button>
    <p class="small" style="margin-top:12px"><a href="https://github.com/briankronberg/wac-court-booker" target="_blank" rel="noopener">WAC Court Booker</a>: created by Brian Kronberg.</p></div>`;
  el.innerHTML = h;

  bindLoginForm("s");
  el.querySelectorAll("[data-la]").forEach((b) => (b.onclick = async () => {
    const l = S.logins[+b.dataset.i];
    if (b.dataset.la === "test") return runJob({ kind: "test-login", login: l.nickname });
    if (b.dataset.la === "buddies") return runJob({ kind: "buddies", login: l.nickname });
    if (b.dataset.la === "family") return familyJob(l.nickname);
    if (await confirmBox("Remove this login?", `${l.username}: its saved password is deleted from this PC.`, "Remove", true)) {
      await afterSave(await api("/api/login/remove", { login: l.nickname }), "Login removed."); refresh();
    }
  }));
  if ($("#wake")) $("#wake").onclick = async () => { const r = await api("/api/wake-timers", {}); toast(r.ok ? "Wake timers are on." : "Not changed: " + r.message, !r.ok); refresh(); };
  $("#so-no").onclick = async () => { if (st.run_signed_out) { await afterSave(await api("/api/settings", { run_signed_out: false }), "Bookings run while you're signed in."); refresh(); } };
  $("#so-yes").onclick = async () => { if (!st.run_signed_out) { await afterSave(await api("/api/settings", { run_signed_out: true }), "Saved."); refresh(); } };
  if ($("#so-pw")) $("#so-pw").onclick = askWindowsPassword;
  $("#clock").onclick = () => runJob({ kind: "clock" });
  $("#rebuild").onclick = async () => { await afterSave(await api("/api/rebuild", {}), "Scheduled tasks rebuilt."); refresh(); };
  if ($("#tb-go")) $("#tb-go").onclick = async () => {
    const partner = $("#tb-partner").value, login = $("#tb-login") ? $("#tb-login").value : S.logins[0].nickname;
    if (!partner) { toast("Choose who you'd play with first.", true); return; }
    if (!(await confirmBox("Make a real test booking?", `This books a real 30-minute singles court with ${partner}, more than a day away. You'll be asked whether to cancel it straight after.`, "Book it"))) return;
    runJob({ kind: "test-booking", login, partner });
  };
  el.querySelectorAll("[data-br]").forEach((b) => (b.onclick = async () => { await afterSave(await api("/api/settings", { browser: b.dataset.br }), "Saved."); refresh(); }));
  if ($("#showwin")) $("#showwin").onchange = async (e) => { await afterSave(await api("/api/settings", { show_window: e.target.checked }), "Saved."); refresh(); };
  $("#upd2").onclick = () => checkUpdate(true);
  $("#desk").onclick = async () => { const x = await api("/api/desktop-shortcut", {}); toast(x.ok ? "The desktop shortcut is ready." : (x.errors || []).join(" "), !x.ok); if (x.ok) refresh(); };
  $("#log2").onclick = async () => { const x = await api("/api/open-log", {}); if (!x.ok) toast((x.errors || []).join(" "), true); };
}

function loginForm(p) {
  return `<div style="margin-top:12px">
    <label class="field"><span>Club username</span><input type="text" id="${p}-user" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span>Club password</span><input type="password" id="${p}-pw" autocomplete="off"></label>
    <p class="small muted">The same username and password you use on the WAC court booking site. The password goes straight into Windows Credential Manager on this PC and is never written to a file.</p>
    <button class="btn primary" id="${p}-save" type="button">Save and test</button></div>`;
}
function bindLoginForm(p, after) {
  const save = $(`#${p}-save`);
  if (!save) return;
  const go = async () => {
    const user = $(`#${p}-user`).value.trim(), pw = $(`#${p}-pw`).value;
    if (!user || !pw) { toast("Type your club username and password.", true); return; }
    save.disabled = true;
    const r = await api("/api/login", { username: user, password: pw });
    $(`#${p}-pw`).value = "";
    save.disabled = false;
    if (!r.ok) { toast((r.errors || []).join(" "), true); return; }
    S = await api("/api/state");
    followJob(r.job, (j) => { if (after) after(j); });
  };
  save.onclick = go;
  $(`#${p}-pw`).onkeydown = (e) => { if (e.key === "Enter") go(); };
}

// ------------------------------------------------------------------ welcome (first run)
function renderWelcome(el) {
  const names = ["Your club login", "Get this PC ready", "Family members", "Your first booking"];
  const st = S.settings;
  let h = `<div class="steps">${names.map((n, i) => `<span class="${i === welcomeStep ? "now" : i < welcomeStep ? "done" : ""}">${i < welcomeStep ? "✓ " : ""}${i + 1}. ${n}</span>`).join("")}</div><div class="card">`;
  if (welcomeStep === 0) {
    h += `<h2>Welcome</h2><p>This app books your tennis courts at WAC the moment the club opens them, 1 week and 1 hour ahead, so you don't have to be up at 5 AM. A few quick steps and you're set.</p>
      <h3 style="margin-top:18px">Sign in to the club</h3>${loginForm("w")}`;
  } else if (welcomeStep === 1) {
    h += `<h2>Get this PC ready</h2><p class="muted">Bookings run on this PC, so it needs to be on (asleep is fine) when a court opens.</p>
      <div class="set-row"><div class="txt"><b>Wake a sleeping PC for a booking</b><br><span class="small muted">Recommended.</span></div>${st.wake_timers ? `<span class="status-ok">On</span>` : `<button class="btn primary" id="wake" type="button">Turn on</button>`}</div>
      <div class="set-row"><div class="txt"><b>PC clock</b><br><span class="small muted">Bookings start to the second.</span></div><button class="btn" id="clock" type="button">Check the clock</button></div>
      <div class="set-row"><div class="txt"><b>Run while signed out of Windows?</b><br><span class="small muted">${esc(SIGNED_OUT_HELP)}</span></div>
        <div class="choices"><button type="button" class="choice" id="so-no" aria-pressed="${!st.run_signed_out}">No</button><button type="button" class="choice" id="so-yes" aria-pressed="${st.run_signed_out}">Yes</button></div></div>
      <div class="row end" style="margin-top:12px"><button class="btn primary big" id="w-next" type="button">Next</button></div>`;
  } else if (welcomeStep === 2) {
    const l = S.logins[0] || { family: [], family_read: false };
    h += `<h2>Family members</h2><p>Family members on your club account aren't on the buddy list, so the app has to look them up. The club site lists them only after a court is in your cart: the app puts a quiet 30-minute court in your cart for a few seconds, reads the names, then presses Back, which empties the cart. <b>Nothing is booked.</b></p>
      ${l.family_read ? `<p class="status-ok">${l.family.length ? "Found: " + esc(namesText(l.family)) : "No family members on this account."}</p>` : ""}
      <div class="row end" style="margin-top:12px"><button class="btn" id="w-skip" type="button">${l.family_read ? "Next" : "Skip"}</button>${l.family_read ? "" : `<button class="btn primary big" id="w-fam" type="button">Find my family members</button>`}</div>`;
  } else {
    h += `<h2>You're ready</h2><p>Now set up the court you want booked. You can add more any time.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary big" id="w-book" type="button">＋ Book a court</button><button class="btn" id="w-later" type="button">Later</button></div>`;
  }
  h += `</div>`;
  el.innerHTML = h;
  if (welcomeStep === 0) bindLoginForm("w", (j) => { if (j.ok) { welcomeStep = 1; render(); } });
  if ($("#wake")) $("#wake").onclick = async () => { const r = await api("/api/wake-timers", {}); toast(r.ok ? "Wake timers are on." : "Not changed: " + r.message, !r.ok); refresh(); };
  if ($("#clock")) $("#clock").onclick = () => runJob({ kind: "clock" });
  if ($("#so-no")) $("#so-no").onclick = async () => { if (st.run_signed_out) await afterSave(await api("/api/settings", { run_signed_out: false })); refresh(); };
  if ($("#so-yes")) $("#so-yes").onclick = async () => { if (!st.run_signed_out) await afterSave(await api("/api/settings", { run_signed_out: true })); refresh(); };
  if ($("#w-next")) $("#w-next").onclick = () => { welcomeStep = 2; render(); };
  if ($("#w-skip")) $("#w-skip").onclick = () => { welcomeStep = 3; render(); };
  if ($("#w-fam")) $("#w-fam").onclick = async () => { await runJob({ kind: "family", login: S.logins[0].nickname }); };
  if ($("#w-book")) $("#w-book").onclick = () => { welcomeStep = null; startForm(null); };
  if ($("#w-later")) $("#w-later").onclick = () => { welcomeStep = null; go("home"); };
}

// ------------------------------------------------------------------ start
setInterval(() => { api("/api/heartbeat", {}).catch(() => {}); }, 30000);
go("home");
refresh().then(() => checkUpdate(false)).catch(() => {});
</script>
</body>
</html>

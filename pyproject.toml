[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wac-court-booker"
version = "0.1.7"
description = "Books WAC Hartland tennis courts the moment each booking window opens."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "keyring>=25",
    "ruamel.yaml>=0.18",
    "tzdata>=2024.1",
    "windows-toasts>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wac-booker = "wacbooker.cli:main"

[tool.setuptools]
packages = ["wacbooker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
